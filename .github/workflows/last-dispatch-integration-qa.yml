name: Last Dispatch integration QA
on:
  push:
    branches: ['feature/last-dispatch-rpg-boss-integration']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-dispatch-integration-qa
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bearframe-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Package verified candidate
        run: |
          python3 tools/package_current.py dist
          python3 tools/verify_package.py dist/Bearframe_The_Last_Dispatch_0.11.10.mcaddon
      - uses: actions/upload-artifact@v4
        with:
          name: Last-Dispatch-0.11.10-integrated-test-candidate
          path: bearframe-repo/dist/*.mcaddon
          if-no-files-found: error
          retention-days: 7
