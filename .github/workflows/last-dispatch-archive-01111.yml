name: Archive Last Dispatch 0.11.11
on:
  push:
    branches: ['release/last-dispatch-0.11.11']
    paths: ['.github/workflows/last-dispatch-archive-01111.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: last-dispatch-archive-01111
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/release/last-dispatch-0.11.11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test, package and verify
        working-directory: bearframe-repo
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          python3 tools/package_current.py dist
          python3 tools/verify_package.py dist/Bearframe_The_Last_Dispatch_0.11.11.mcaddon
      - name: Match recovered installer payload
        working-directory: bearframe-repo
        run: |
          python3 - <<'PY'
          import hashlib
          from zipfile import ZipFile
          path = 'dist/Bearframe_The_Last_Dispatch_0.11.11.mcaddon'
          with ZipFile(path) as z:
              assert len(z.namelist()) == len(set(z.namelist())) == 726
              digest = hashlib.sha256()
              for name in sorted(z.namelist()):
                  digest.update(name.encode() + b'\0' + hashlib.sha256(z.read(name)).digest())
              assert digest.hexdigest() == '10a9b877b2ad5e7d1e9a76d0b0d00c4b9e237758dc325fd73646e104aad1b5fd', digest.hexdigest()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Last-Dispatch-0.11.11-verified
          path: bearframe-repo/dist/Bearframe_The_Last_Dispatch_0.11.11.mcaddon
          if-no-files-found: error
          retention-days: 30
      - name: Preserve verified installer in GitHub
        run: |
          mkdir -p bearframe-repo/releases
          cp bearframe-repo/dist/Bearframe_The_Last_Dispatch_0.11.11.mcaddon bearframe-repo/releases/
          cd bearframe-repo/releases
          sha256sum Bearframe_The_Last_Dispatch_0.11.11.mcaddon > Bearframe_The_Last_Dispatch_0.11.11.mcaddon.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Bearframe_The_Last_Dispatch_0.11.11.mcaddon Bearframe_The_Last_Dispatch_0.11.11.mcaddon.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Archive verified Last Dispatch 0.11.11 installer and checksum'
            git push origin HEAD:refs/heads/release/last-dispatch-0.11.11
          fi
